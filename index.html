<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HARMONICPATTERNS</title>
<style>
:root{
--bg:#04060c;--bg2:#080b13;--panel:#0a0f1a;--panel2:#0d1422;--border:rgba(148,163,184,.10);
--txt:#dbe4f0;--dim:#7d8aa0;--acc:#22d3ee;--gold:#f6c453;--up:#0ecb81;--dn:#f6465d;
--glass:rgba(13,20,34,.82);--shadow:0 12px 40px rgba(0,0,0,.55);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:radial-gradient(1200px 700px at 80% -10%,#0b1626 0%,var(--bg) 55%) fixed,var(--bg);
color:var(--txt);font:13px/1.45 "Segoe UI",Inter,system-ui,sans-serif;overflow:hidden;display:flex;flex-direction:column}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#1c2940;border-radius:9px;border:2px solid var(--bg)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;color:var(--txt);background:#0b1220;border:1px solid var(--border);border-radius:8px;padding:7px 10px;outline:none}
input:focus,select:focus{border-color:rgba(34,211,238,.5);box-shadow:0 0 0 3px rgba(34,211,238,.12)}
.sp{flex:1}
#topbar{height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;background:linear-gradient(180deg,rgba(16,24,40,.95),rgba(9,13,22,.9));
border-bottom:1px solid var(--border);backdrop-filter:blur(12px);z-index:50}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.5px}
.logo .cube{width:28px;height:28px;border-radius:8px;background:conic-gradient(from 210deg,#22d3ee,#3b82f6,#8b5cf6,#22d3ee);
box-shadow:0 0 18px rgba(34,211,238,.5);display:grid;place-items:center;font-size:14px;color:#031018}
.logo b{font-size:15px}.logo small{color:var(--dim);font-weight:600;margin-left:2px}
.tbtn{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9px;border:1px solid var(--border);
background:linear-gradient(180deg,#101a2c,#0b1322);color:var(--dim);font-weight:600;transition:.15s}
.tbtn:hover{color:var(--txt);border-color:rgba(34,211,238,.4);box-shadow:0 0 12px rgba(34,211,238,.15)}
.tbtn.on{color:#052027;background:linear-gradient(180deg,#3ae0f5,#17b6d4);border-color:transparent;box-shadow:0 4px 16px rgba(34,211,238,.35)}
#netDot{width:9px;height:9px;border-radius:50%;background:var(--up);box-shadow:0 0 8px var(--up)}
#clock{font-variant-numeric:tabular-nums;color:var(--dim);font-weight:600}
#topTicker{display:flex;align-items:center;gap:8px;padding:5px 11px;border-radius:9px;border:1px solid var(--border);
background:linear-gradient(180deg,#101a2c,#0b1322);font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
#ttSym{color:var(--dim);font-size:11px;letter-spacing:.4px}
#ttPrice{font-size:12.5px}
#topTicker .tt-sep{width:1px;height:16px;background:var(--border)}
#ttCount{color:var(--acc);font-size:12px;font-weight:800}
#main{flex:1;display:flex;min-height:0}
#grid{flex:1;display:grid;gap:8px;padding:8px;min-width:0;grid-template-columns:1fr}
#grid.l2{grid-template-columns:1fr 1fr}
#grid.l3{grid-template-columns:1fr 1fr 1fr}
#grid.maxed{grid-template-columns:1fr!important;grid-template-rows:1fr;padding:4px}
#grid.maxed .panel:not(.max){display:none}
#grid.maxed .panel.max{height:100%;overflow:hidden}
.panel{display:flex;flex-direction:column;min-height:0;border:1px solid var(--border);border-radius:14px;overflow:hidden;
background:linear-gradient(180deg,var(--panel),var(--bg2));box-shadow:var(--shadow);transition:border-color .2s}
.panel.focus{border-color:rgba(34,211,238,.45);box-shadow:0 0 0 1px rgba(34,211,238,.25),var(--shadow)}
.p-head{display:flex;align-items:center;gap:6px;padding:7px 9px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.015);user-select:none}
.chip{display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:8px;border:1px solid var(--border);
background:#0c1526;font-weight:700;letter-spacing:.3px;transition:.15s}
.chip:hover{border-color:rgba(34,211,238,.5)}
.chip .car{color:var(--dim);font-size:9px}
.ico{width:29px;height:29px;border-radius:8px;display:grid;place-items:center;color:var(--dim);font-size:14px;border:1px solid transparent;transition:.15s}
.ico:hover{color:var(--txt);background:#111c30;border-color:var(--border)}
.ico.on{color:#052027;background:var(--acc);box-shadow:0 0 12px rgba(34,211,238,.45)}
.p-body{flex:1;position:relative;min-height:0}
.cwrap{position:absolute;inset:0}
canvas{width:100%;height:100%;display:block;cursor:crosshair}
.legend{position:absolute;top:8px;left:10px;z-index:5;pointer-events:none;font-size:11.5px;font-variant-numeric:tabular-nums;
background:rgba(8,12,20,.55);padding:5px 10px;border-radius:8px;backdrop-filter:blur(6px);border:1px solid rgba(148,163,184,.08);max-width:calc(100% - 20px)}
.legend b{color:var(--acc)}.legend .k{color:var(--dim)}.legend .u{color:var(--up);font-weight:700}.legend .d{color:var(--dn);font-weight:700}
.rdock{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);z-index:8;display:flex;align-items:center;gap:6px;
background:var(--glass);border:1px solid rgba(34,211,238,.35);border-radius:12px;padding:6px 10px;backdrop-filter:blur(10px);box-shadow:var(--shadow)}
.rdock.hidden{display:none}
.rdock button{padding:4px 9px;border-radius:7px;font-weight:700;color:var(--acc)}
.rdock button:hover{background:rgba(34,211,238,.12)}
.rdock .cnt{color:var(--dim);font-variant-numeric:tabular-nums;font-size:11px;min-width:70px;text-align:center}
.rbadge{position:absolute;top:8px;right:96px;z-index:5;background:rgba(246,196,83,.14);border:1px solid rgba(246,196,83,.5);
color:var(--gold);font-size:10.5px;font-weight:800;letter-spacing:1px;padding:3px 9px;border-radius:7px;display:none}
#statusbar{height:26px;display:flex;align-items:center;gap:16px;padding:0 14px;font-size:11px;color:var(--dim);
border-top:1px solid var(--border);background:rgba(8,12,20,.9);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
#pop{position:fixed;z-index:200;background:var(--glass);border:1px solid rgba(148,163,184,.18);border-radius:13px;
box-shadow:var(--shadow);backdrop-filter:blur(16px);display:none;overflow:hidden;animation:pop .14s ease}
@keyframes pop{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.pop-h{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center}
.pop-b{max-height:52vh;overflow:auto;min-width:250px}
.tfg{padding:6px 12px 2px;font-size:10px;letter-spacing:1.5px;color:var(--dim);font-weight:700}
.tfi{display:inline-block;padding:5px 10px;margin:3px 0 3px 8px;border-radius:7px;border:1px solid var(--border);font-weight:700;font-size:12px;background:#0c1526}
.tfi:hover{border-color:var(--acc);color:var(--acc)}
.tfi.cur{background:var(--acc);color:#052027;border-color:transparent}
.srow{display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;border-bottom:1px solid rgba(148,163,184,.05)}
.srow:hover{background:rgba(34,211,238,.07)}
.srow .sy{font-weight:700;width:130px}.srow .pr{font-variant-numeric:tabular-nums}.srow .ch{margin-left:auto;font-size:11px;font-weight:700}
.srow .st{color:var(--gold);font-size:13px;opacity:.25}.srow .st.on{opacity:1}
#modalBg{position:fixed;inset:0;background:rgba(2,4,9,.66);backdrop-filter:blur(4px);z-index:300;display:none;place-items:center}
.modal{width:min(680px,94vw);max-height:86vh;overflow:auto;background:linear-gradient(180deg,#0e1524,#090e19);
border:1px solid rgba(148,163,184,.16);border-radius:16px;box-shadow:var(--shadow);animation:pop .16s ease}
.m-h{display:flex;align-items:center;padding:15px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#0e1524ee;z-index:2}
.m-h h3{font-size:15px}.m-h .x{margin-left:auto;font-size:16px;color:var(--dim);padding:4px 8px;border-radius:7px}
.m-h .x:hover{color:var(--dn);background:rgba(246,70,93,.1)}
.m-b{padding:14px 18px;max-height:calc(86vh - 60px);overflow-y:auto}
.irow{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--border);border-radius:11px;margin-bottom:9px;background:rgba(255,255,255,.012)}
.irow .nm{font-weight:700}.irow .ds{font-size:11px;color:var(--dim);max-width:340px}
.irow .par{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.irow input[type=number]{width:70px;padding:5px 7px}
.sw{position:relative;width:40px;height:22px;flex:none;cursor:pointer}
.sw input{display:none}
.sw i{position:absolute;inset:0;border-radius:20px;background:#1a2438;border:1px solid var(--border);transition:.18s}
.sw i:after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#5b6b85;transition:.18s}
.sw input:checked+i{background:linear-gradient(90deg,#0ea5b7,#22d3ee);border-color:transparent}
.sw input:checked+i:after{left:20px;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.6)}
.btn{padding:8px 15px;border-radius:9px;font-weight:700;border:1px solid var(--border);background:#101a2c;transition:.15s}
.btn:hover{border-color:rgba(34,211,238,.5)}
.btn.prime{background:linear-gradient(180deg,#3ae0f5,#14a8c4);color:#04202a;border:none;box-shadow:0 4px 14px rgba(34,211,238,.3)}
.fld{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--dim);font-weight:600}
#toasts{position:fixed;right:16px;bottom:40px;z-index:500;display:flex;flex-direction:column;gap:8px}
.toast{min-width:250px;max-width:360px;background:var(--glass);border:1px solid rgba(148,163,184,.2);border-left:3px solid var(--acc);
border-radius:11px;padding:11px 14px;backdrop-filter:blur(14px);box-shadow:var(--shadow);animation:tin .25s ease;font-size:12.5px}
.toast.ok{border-left-color:var(--up)}.toast.err{border-left-color:var(--dn)}.toast.wrn{border-left-color:var(--gold)}
.toast b{display:block;margin-bottom:2px}
@keyframes tin{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.loading{position:absolute;inset:0;display:grid;place-items:center;z-index:9;background:rgba(5,8,14,.55);backdrop-filter:blur(2px)}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(34,211,238,.15);border-top-color:var(--acc);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.tools-cat{padding:8px 12px 4px;font-size:9.5px;letter-spacing:1.6px;color:var(--dim);font-weight:800;border-top:1px solid var(--border);margin-top:4px}
.tools-cat:first-child{border-top:none;margin-top:0}
.tools-grid{display:flex;flex-wrap:wrap;gap:4px;padding:2px 10px 8px}
.tools-grid .tb{padding:5px 10px;border-radius:7px;border:1px solid var(--border);font-size:11px;font-weight:700;
background:#0c1526;color:var(--dim);transition:.15s;white-space:nowrap}
.tools-grid .tb:hover{border-color:var(--acc);color:var(--acc);background:rgba(34,211,238,.06)}
.tools-grid .tb.active{background:var(--acc);color:#052027;border-color:transparent}
.ind-cat{padding:10px 12px 5px;font-size:10px;letter-spacing:1.6px;color:var(--dim);font-weight:800;border-bottom:1px solid var(--border);margin-bottom:8px}
@media(max-width:1100px){#grid.l3{grid-template-columns:1fr}#grid.l2{grid-template-columns:1fr}}
@media(max-width:980px){#ttSym{display:none}}
/* ============================================================
TRADERS · VENTANA (aggr.trade port) — CSS aditivo, prefijo tw-
============================================================ */
#tradersWin{position:fixed;top:58px;right:14px;width:440px;height:min(62vh,660px);min-width:330px;min-height:230px;
max-width:calc(100vw - 12px);max-height:calc(100vh - 88px);z-index:160;display:none;flex-direction:column;
background:linear-gradient(180deg,rgba(14,21,36,.96),rgba(9,14,25,.96));border:1px solid rgba(148,163,184,.2);
border-radius:14px;box-shadow:var(--shadow);backdrop-filter:blur(14px);overflow:hidden;resize:both}
#tradersWin.open{display:flex}
.tw-h{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--border);cursor:move;
user-select:none;background:rgba(255,255,255,.02);flex:none;touch-action:none}
.tw-h b{font-size:12.5px;letter-spacing:.6px}
.tw-sub{font-size:10px;color:var(--dim);font-weight:600;white-space:nowrap}
.tw-dot{width:8px;height:8px;border-radius:50%;background:var(--dn);box-shadow:0 0 6px var(--dn);flex:none}
.tw-dot.on{background:var(--up);box-shadow:0 0 6px var(--up)}
.tw-ico{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--dim);font-size:13px;border:1px solid transparent;flex:none}
.tw-ico:hover{color:var(--txt);background:#111c30;border-color:var(--border)}
.tw-ico.on{color:#052027;background:var(--acc)}
.tw-set{display:none;padding:8px 10px;border-bottom:1px solid var(--border);grid-template-columns:repeat(3,1fr);gap:5px 8px;flex:none;background:rgba(8,12,20,.5)}
.tw-set.open{display:grid}
.tw-set label{font-size:10.5px;color:var(--dim);display:flex;gap:5px;align-items:center;font-weight:600;white-space:nowrap}
.tw-set input[type=checkbox]{accent-color:#22d3ee}
.tw-set input[type=number]{width:64px;padding:3px 6px;font-size:11px;border-radius:6px}
.tw-feed{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;font-variant-numeric:tabular-nums;min-height:0}
.tw-row{position:relative;display:flex;align-items:center;gap:7px;padding:3px 10px;font-size:11.5px;
border-bottom:1px solid rgba(148,163,184,.04);white-space:nowrap;overflow:hidden}
.tw-row .bg{position:absolute;left:0;top:0;bottom:0;width:100%;pointer-events:none}
.tw-row.liq .bg{opacity:.92}
.tw-row span{position:relative;z-index:1}
.tw-row .sd{flex:none;width:14px;text-align:center;font-size:10px}
.tw-row .lg{flex:none;font-size:8.5px;font-weight:800;letter-spacing:.4px;padding:2px 5px;border-radius:5px;color:#04060c}
.tw-row .pair{color:inherit;opacity:.75;font-size:10px;flex:none}
.tw-row .pr{flex:none;min-width:82px;text-align:right;font-weight:600}
.tw-row .amt{margin-left:auto;font-weight:800}
.tw-row .ago{flex:none;width:32px;text-align:right;font-size:10px;opacity:.7}
.tw-f{display:flex;gap:10px;align-items:center;padding:6px 10px;border-top:1px solid var(--border);font-size:10.5px;
color:var(--dim);flex:none;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.tw-f .ex{display:flex;gap:4px;align-items:center}
.tw-f .ed{width:7px;height:7px;border-radius:50%;background:#334155;flex:none}
.tw-f .ed.on{background:var(--up);box-shadow:0 0 5px var(--up)}
.tw-fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.tw-fx span{position:absolute;font-size:36px;will-change:transform,opacity}
.tw-fx .up{animation:twUp 1.6s ease-out forwards}
.tw-fx .down{animation:twDown 1.6s ease-in forwards}
.tw-fx .boom{animation:twBoom 1.1s ease-out forwards;left:50%;top:45%}
@keyframes twUp{from{transform:translateY(30px) scale(.7);opacity:0}20%{opacity:1}to{transform:translateY(-160px) scale(1.25);opacity:0}}
@keyframes twDown{from{transform:translateY(-30px) scale(.7);opacity:0}20%{opacity:1}to{transform:translateY(160px) scale(1.25);opacity:0}}
@keyframes twBoom{from{transform:translate(-50%,-50%) scale(.3);opacity:0}25%{opacity:1}to{transform:translate(-50%,-50%) scale(2.6);opacity:0}}
@media(max-width:640px){#tradersWin{width:calc(100vw - 16px);right:8px;top:56px}}
/* ============================================================
TRADERS · EDITOR DE UMBRALES (paridad aggr.trade)
Slider Small↔Large orders + grupos TRADES / LIQUIDATIONS
============================================================ */
.tw-cfg{display:none;flex:none;max-height:60%;overflow-y:auto;overflow-x:hidden;border-bottom:1px solid var(--border);background:rgba(8,12,20,.62)}
.tw-cfg.open{display:block}
.tw-cfg::-webkit-scrollbar{width:8px}
.tw-cfg::-webkit-scrollbar-thumb{background:#22304a;border-radius:8px;border:2px solid #080c14}
.tw-cfg::-webkit-scrollbar-thumb:hover{background:#2e4062}
.tw-cfg .tw-set{display:grid;border-bottom:1px solid var(--border)}
.tw-slider{padding:10px 12px 9px;border-bottom:1px solid var(--border)}
.tw-slider .lbls{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--dim);font-weight:700;margin-bottom:7px;white-space:nowrap}
.tw-slider .lbls .ar{color:#5b6b85;font-size:11px}
#twMultLbl{color:var(--up);font-weight:800;font-size:11px;font-variant-numeric:tabular-nums}
#twSlider{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;outline:none;border:none;padding:0;cursor:pointer;
background:linear-gradient(90deg,#3d4f5f 0%,#3d4f5f 57%,#19b45f 57%,#2ee06f 100%)}
#twSlider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid #0a0f1a;box-shadow:0 0 8px rgba(46,224,111,.55);cursor:grab}
#twSlider::-webkit-slider-thumb:active{cursor:grabbing;transform:scale(1.1)}
#twSlider::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid #0a0f1a;box-shadow:0 0 8px rgba(46,224,111,.55);cursor:grab}
.tw-group{border-bottom:1px solid var(--border)}
.tw-group:last-child{border-bottom:none}
.tw-gh{display:flex;align-items:center;gap:7px;padding:8px 10px}
.tw-gh b{font-size:11.5px;letter-spacing:.9px}
.tw-cnt{font-size:9.5px;border:1px solid var(--border);border-radius:5px;padding:0 5px;color:var(--dim);font-weight:800;line-height:15px}
.tw-ck{position:relative;width:18px;height:18px;flex:none;cursor:pointer;display:inline-block}
.tw-ck input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.tw-ck i{position:absolute;inset:0;border-radius:5px;background:#1a2438;border:1px solid var(--border);display:grid;place-items:center;font-size:11px;color:transparent;font-style:normal;transition:.15s;pointer-events:none}
.tw-ck input:checked+i{background:#2ea043;border-color:#2ea043;color:#fff}
.tw-msw{width:26px;height:26px;border-radius:7px;border:1px solid rgba(255,255,255,.16);overflow:hidden;position:relative;flex:none;cursor:pointer;padding:0;transition:.15s}
.tw-msw:hover{border-color:rgba(255,255,255,.45);transform:scale(1.06)}
.tw-msw i,.tw-sw i{position:absolute;inset:0;display:block;pointer-events:none}
.tw-chev{color:var(--dim);font-size:11px;padding:2px 6px;transition:transform .18s;flex:none}
.tw-chev:hover{color:var(--txt)}
.tw-group.col .tw-chev{transform:rotate(180deg)}
.tw-group.col .tw-gbody{display:none}
.tw-gbody{padding:0 10px 9px}
.tw-cols,.tw-trow{display:grid;grid-template-columns:20px minmax(58px,1fr) 30px 30px 20px;gap:7px;align-items:center}
.tw-cols{padding:1px 0 4px}
.tw-flip{font-size:8.5px;letter-spacing:1.2px;color:var(--dim);font-weight:800;padding:2px 0;text-align:center}
.tw-flip:hover{color:var(--acc)}
.tw-trow{padding:5px 0;border-top:1px solid rgba(148,163,184,.05)}
.tw-trow.off{opacity:.38}
.tw-ckpad{width:18px;height:18px}
.tw-amt{display:flex;align-items:center;gap:5px;min-width:0}
.tw-amt>span{color:var(--up);font-weight:800;font-size:12px;flex:none}
.tw-amt input{flex:1;min-width:0;background:transparent;border:none;border-bottom:1px solid transparent;padding:3px 2px;font-size:12px;font-weight:700;color:var(--txt);border-radius:0;font-variant-numeric:tabular-nums}
.tw-amt input:focus{border-bottom-color:var(--acc);box-shadow:none}
.tw-max{color:var(--dn);font-size:9.5px;font-weight:800;letter-spacing:.6px;font-style:normal;flex:none}
.tw-sw{width:30px;height:24px;border-radius:6px;border:1px solid rgba(255,255,255,.18);position:relative;overflow:hidden;cursor:pointer;padding:0;
background:repeating-conic-gradient(#454e63 0% 25%,#2a3245 0% 50%) 0 0/8px 8px;transition:.15s}
.tw-sw:hover{border-color:rgba(255,255,255,.5);transform:scale(1.07)}
.tw-kb{color:var(--dim);font-size:14px;padding:2px 4px;border-radius:6px;line-height:1}
.tw-kb:hover{color:var(--txt);background:#111c30}

function _ggvpTfMs(tf){
const n=parseInt(tf),u=String(tf).slice(-1);
if(!isFinite(n))return 0;
if(u==='s')return n*1000;
if(u==='m')return n*60000;
if(u==='h')return n*3600000;
if(u==='d')return n*86400000;
if(u==='w')return n*604800000;
if(u==='M')return n*2592000000;
if(u==='y')return n*31536000000;
return 0;
}
function _ggvpResample(bars,tf){
const n=Math.max(1,parseInt(tf)||1),u=tf.slice(-1);
let plan;
if(u==='M')plan={mode:'months',factor:n};
else if(u==='w')plan={mode:'weeks',factor:n};
else plan={mode:'u',factor:n,periodMs:_ggvpTfMs(tf)};
const out=[];let cur=null,k0=null;
for(let i=0;i<bars.length;i++){
const b=bars[i],k=groupKey(plan,b.t);
if(k0===null||k!==k0){if(cur)out.push(cur);k0=k;cur={t:b.t,o:b.o,h:b.h,l:b.l,c:b.c,v:b.v,endIdx:i}}
else{if(b.h>cur.h)cur.h=b.h;if(b.l<cur.l)cur.l=b.l;cur.c=b.c;cur.v+=b.v;cur.endIdx=i}}
if(cur)out.push(cur);

function computeGreerGaps(bars,cfg,chartTf){
const out={boxes:[],count:0,tfUsed:chartTf};
const n=bars.length;if(n<3)return out;
const lookback=Math.max(2,Math.round(+cfg.lookback||34));
const extend=Math.max(0,Math.round(isFinite(+cfg.extend)?+cfg.extend:20));
const extGBull=Math.max(0,Math.round(isFinite(+cfg.extendBullGreer)?+cfg.extendBullGreer:30));
const extGBear=Math.max(0,Math.round(isFinite(+cfg.extendBearGreer)?+cfg.extendBearGreer:30));
const tfSel=String(cfg.tf||'auto');
let src=bars,anchorOf=i=>i;
if(tfSel!=='auto'&&_ggvpTfMs(tfSel)>_ggvpTfMs(chartTf)){
src=_ggvpResample(bars,tfSel);
anchorOf=i=>src[i].endIdx;
out.tfUsed=tfSel;

if(src.length<lookback+1)return out;
const boxes=[],records=[];
let t=0,shownGBullSinceBear=false,shownGBearSinceBull=false,lastGBull=null,lastGBear=null;
const push=(kind,anchor,ext,top,bottom)=>{
boxes.unshift({left:Math.max(0,anchor-lookback),right:anchor+ext,top:top,bottom:bottom,kind:kind});
if(boxes.length>GGVP_MAX_BOXES)boxes.pop();

for(let i=lookback;i<src.length;i++){
const b=src[i],ref=src[i-lookback],refClose=src[i-(lookback-1)].c;
const bull=b.l>ref.h&&refClose>ref.h;
const bear=b.h<ref.l&&refClose<ref.l;
if(!bull&&!bear)continue;
const f=bull?{max:b.l,min:ref.h,isbull:true,t:b.t}:{max:ref.l,min:b.h,isbull:false,t:b.t};
if(f.t===t)continue;
const anchor=anchorOf(i);
if(bull){
if(cfg.showBull)push('bull',anchor,extend,f.max,f.min);
if(records.length>0){
let latestBear=null;
for(let k=0;k<records.length;k++){if(!records[k].isbull){latestBear=records[k];break}}
if(latestBear&&f.min>latestBear.max){
let plot=false;
if(cfg.showGBull&&!shownGBullSinceBear){
if(!lastGBull)plot=true;
else if(f.min<=lastGBull.min)plot=true;
}
if(plot){push('gbull',anchor,extGBull,f.max,f.min);shownGBullSinceBear=true}
lastGBull={max:f.max,min:f.min,isbull:true,t:f.t};
}
}
records.unshift({max:f.max,min:f.min,isbull:true,t:f.t});
t=f.t;shownGBearSinceBull=false;
}else{
if(cfg.showBear)push('bear',anchor,extend,f.max,f.min);
if(records.length>0){
let latestBull=null;
for(let k=0;k<records.length;k++){if(records[k].isbull){latestBull=records[k];break}}
if(latestBull&&f.max<latestBull.min){
let plot=false;
if(cfg.showGBear&&!shownGBearSinceBull){
if(!lastGBear)plot=true;
else if(f.max>=lastGBear.max)plot=true;
}
if(plot){push('gbear',anchor,extGBear,f.max,f.min);shownGBearSinceBull=true}
lastGBear={max:f.max,min:f.min,isbull:false,t:f.t};
}
}

out.boxes=boxes;out.count=boxes.length;

function computeFr3d0VP(bars,cfg){
const out={ok:false,rows:[],rangeHigh:NaN,rangeLow:NaN,leftIdx:0,anchor:0,poc:NaN};
const n=bars.length;
const numOfBars=clamp(Math.round(+cfg.vpBars||90),14,365);
const dist=clamp(Math.round(+cfg.vpDist||2),2,20);
const rows=clamp(Math.round(+cfg.vpRows||50),10,200);
const width=clamp(Math.round(+cfg.vpWidth||50),20,100);
if(n<numOfBars)return out;
let hi=-Infinity,lo=Infinity;
for(let i=n-numOfBars;i<n;i++){const b=bars[i];if(b.h>hi)hi=b.h;if(b.l<lo)lo=b.l}
const hH=(hi-lo)/rows;
out.rangeHigh=hi;out.rangeLow=lo;

out.anchor=n-1+dist;
if(!(hH>0))return out;
const buy=new Float64Array(rows),sell=new Float64Array(rows);
for(let i=n-numOfBars;i<n;i++){
const b=bars[i],bh=b.h-b.l;
if(bh<=0)continue;
const bv=b.v*(b.c-b.l)/bh,sv=b.v*(b.h-b.c)/bh;

const hL=lo+hH*j,hHi=lo+hH*(j+1);

-(Math.max(hHi,b.h)-Math.min(hHi,b.h))
-(Math.max(hL,b.l)-Math.min(hL,b.l));
const pct=target/bh;
if(pct>0){buy[j]+=bv*pct;sell[j]+=sv*pct}
}
}
let maxVol=0,maxJ=-1;
for(let j=0;j<rows;j++){const v=buy[j]+sell[j];if(v>maxVol){maxVol=v;maxJ=j}}

const w=width*v/maxVol;
out.rows.push({low:lo+hH*j,high:lo+hH*(j+1),buyW:Math.floor(w*buy[j]/v),sellW:Math.floor(w*sell[j]/v)});
}
out.poc=lo+hH*(maxJ+0.5);
out.ok=true;
return out;
}

async loadTicker(exchange='binance'){
if(exchange==='gate'){
const data=await apiGetGate('/spot/tickers');
return data.filter(t=>t.currency_pair && t.last && +t.quote_volume>0)
.sort((a,b)=>+b.quote_volume - +a.quote_volume)
.slice(0, 1200)
.map(t=>({symbol:t.currency_pair.replace('_',''), lastPrice:t.last, priceChangePercent:t.change_percentage, quoteVolume:t.quote_volume}));
} else if(exchange==='bybit'){
const res=await apiGetBybit('/v5/market/tickers?category=spot');
if(!res || res.retCode!==0 || !res.result || !res.result.list) throw new Error('error');
return res.result.list
.filter(t=>t.symbol && t.lastPrice && +t.quoteVolume>0)
.sort((a,b)=>+b.quoteVolume - +a.quoteVolume)
.slice(0, 1200)
.map(t=>({symbol:t.symbol, lastPrice:t.lastPrice, priceChangePercent:t.price24hPcnt, quoteVolume:t.quoteVolume}));
} else if(exchange==='coinbase'){
const prods=await apiGetCoinbase('/products');
const filtered=prods.filter(p=>p.quote_currency==='USD' && p.status==='online').slice(0,300);
const stats=await Promise.all(filtered.slice(0,100).map(async p=>{
try{
const st=await apiGetCoinbase(`/products/${p.id}/stats`);
return {symbol:p.id.replace('-',''), lastPrice:st.last, priceChangePercent:st.open?((+st.last - +st.open)/+st.open*100):0, quoteVolume:st.volume};
}catch(e){return null;}
}));
return stats.filter(x=>x).sort((a,b)=>+b.quoteVolume - +a.quoteVolume).slice(0,1200);
} else if(exchange==='bitso'){
const res=await apiGetBitso('/ticker/');
let payload=res&&res.payload;
let arr=[];
if(Array.isArray(payload))arr=payload;
else if(payload&&typeof payload==='object')arr=Object.values(payload);
return arr.filter(t=>t.book&&t.last)
.map(t=>{
const last=+t.last;
const ch24=+t.change_24||0;
const open=last-ch24;
const pct=open>0?(ch24/open)*100:0;
const vol=+t.volume||0;
const vwap=+t.vwap||last;
return {symbol:t.book.replace(/_/g,'').toUpperCase(), lastPrice:last, priceChangePercent:pct, quoteVolume:vol*vwap};
})
.sort((a,b)=>b.quoteVolume-a.quoteVolume)
.slice(0,1200);
} else {
if(this.tickerCache&&Date.now()-this.tickerTs<300000)return this.tickerCache;
const data=await apiGet('/api/v3/ticker/24hr');
const QUOTES=['USDT','USDC','FDUSD','TUSD','BTC','ETH','BNB'];
this.tickerCache=data.filter(t=>QUOTES.some(q=>t.symbol.endsWith(q))&&+t.quoteVolume>0)
.sort((a,b)=>+b.quoteVolume-+a.quoteVolume).slice(0,1200);
this.tickerTs=Date.now();return this.tickerCache;
}
},
async atomicScanSymbol(rawSymbol) {
const sym = String(rawSymbol).trim().toUpperCase();
if (!sym) return { valid: false, exchange: null, normalizedSymbol: null };
toast('🔬 Escaneo Atómico', 'Analizando ' + sym + ' en todos los exchanges...', 'wrn');
const candidates = [];
try {
const bnSym = sym.replace(/_/g, '').replace(/-/g, '');
const res = await fetch('https://api.binance.com/api/v3/klines?symbol=' + bnSym + '&interval=1h&limit=1', { cache: 'no-store' });
if (res.ok) {
const data = await res.json();
if (Array.isArray(data) && data.length > 0) {
candidates.push({ exchange: 'binance', normalizedSymbol: bnSym, priority: 1 });
}
}
} catch (e) {}
try {
const gateSym = gatePair(sym.replace(/-/g, ''));
const res = await fetch(GATE_RHOST + '/spot/candlesticks?currency_pair=' + gateSym + '&interval=1h&limit=1', { cache: 'no-store' });
if (res.ok) {
const data = await res.json();
if (Array.isArray(data) && data.length > 0) {
candidates.push({ exchange: 'gate', normalizedSymbol: sym.replace(/-/g, ''), priority: 2 });
}
}
} catch (e) {}
try {
const bybitSym = sym.replace(/_/g, '').replace(/-/g, '');
const res = await fetch(BYBIT_RHOST + '/v5/market/kline?category=spot&symbol=' + bybitSym + '&interval=60&limit=1', { cache: 'no-store' });
if (res.ok) {
const data = await res.json();
if (data && data.retCode === 0 && data.result && data.result.list && data.result.list.length > 0) {
candidates.push({ exchange: 'bybit', normalizedSymbol: bybitSym, priority: 3 });
}
}
} catch (e) {}
try {
const cbSym = coinbasePair(sym.replace(/_/g, ''));
const res = await fetch(COINBASE_RHOST + '/products/' + cbSym + '/candles?granularity=3600', { cache: 'no-store' });
if (res.ok) {
const data = await res.json();
if (Array.isArray(data) && data.length > 0) {
candidates.push({ exchange: 'coinbase', normalizedSymbol: sym.replace(/-/g, ''), priority: 4 });
}
}
} catch (e) {}
try {
const bitsoSym = bitsoPair(sym.replace(/_/g, ''));
const res = await apiGetBitso('/ticker/?book=' + bitsoSym);
if (res && res.success && res.payload) {
candidates.push({ exchange: 'bitso', normalizedSymbol: sym.replace(/-/g, ''), priority: 5 });
}
} catch (e) {}
if (candidates.length === 0) {
return { valid: false, exchange: null, normalizedSymbol: null };
}
candidates.sort((a, b) => a.priority - b.priority);
const winner = candidates[0];
const exLabels = { binance: 'Binance', gate: 'Gate.io', bybit: 'Bybit', coinbase: 'Coinbase', bitso: 'Bitso' };
toast('✅ Activo Detectado', sym + ' encontrado en ' + exLabels[winner.exchange], 'ok');
return { valid: true, exchange: winner.exchange, normalizedSymbol: winner.normalizedSymbol };
},

.ab-strip{display:flex;gap:10px;align-items:center;padding:5px 10px;border-bottom:1px solid var(--border);font-size:9.5px;color:var(--dim);flex:none;white-space:nowrap;overflow-x:auto;font-variant-numeric:tabular-nums}

.ab-tabs button.on{background:linear-gradient(180deg,#3ae0f5,#14a8c4);color:#04202a;border-color:transparent}
.ab-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px;min-height:0}
.ab-body::-webkit-scrollbar,.ab-strip::-webkit-scrollbar,.ab-tabs::-webkit-scrollbar{width:8px;height:6px}

.ab-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ab-fld{display:flex;flex-direction:column;gap:4px;font-size:10.5px;color:var(--dim);font-weight:600;min-width:0}

.ab-check{flex-direction:row;align-items:center;gap:7px;padding:6px 0}

.ab-foot{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap;align-items:center}

.ab-orow{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:7px;background:#0c1526;margin-bottom:4px;font-size:11px;font-weight:700}
.ab-orow .ab-arrow{color:var(--dim)}
.ab-buy{color:var(--up)!important}.ab-sell{color:var(--dn)!important}
.ab-pos{border:1px solid var(--border);border-radius:10px;padding:8px;margin-bottom:8px;background:#0c1526}
.ab-pos-h{display:flex;align-items:center;gap:7px;font-size:11.5px;margin-bottom:6px}
.ab-pos-g{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 8px;font-size:10px;color:var(--dim)}
.ab-pos-g b{color:var(--txt);display:block;font-size:10.5px}
.ab-chip{font-size:8.5px;font-weight:800;letter-spacing:.5px;padding:2px 6px;border-radius:5px;background:rgba(34,211,238,.14);color:var(--acc)}
.ab-log{display:flex;gap:7px;align-items:flex-start;padding:5px 6px;border-bottom:1px solid rgba(148,163,184,.05);font-size:10.5px}
.ab-log-t{color:var(--dim);font-variant-numeric:tabular-nums;flex:none}

.ab-st-signal{background:rgba(34,211,238,.14);color:var(--acc)}
.ab-st-decision{background:rgba(167,139,250,.16);color:#a78bfa}
.ab-st-order{background:rgba(246,196,83,.16);color:var(--gold)}
.ab-st-fill{background:rgba(14,203,129,.16);color:var(--up)}
.ab-st-exit{background:rgba(96,165,250,.16);color:#60a5fa}
.ab-st-risk{background:rgba(246,196,83,.16);color:var(--gold)}
.ab-st-plus{background:rgba(246,70,93,.2);color:var(--dn)}
.ab-st-error{background:rgba(246,70,93,.2);color:var(--dn)}
.ab-empty{padding:16px;text-align:center;color:var(--dim);font-size:11px}
.ab-steps{font-size:11px;color:var(--dim);line-height:1.8}
.ab-steps b{color:var(--acc)}

function abDecide(kind,anchor){
if(!C.enabled)return;
const kc=kind==='liq'?C.liqs:C.trades,now=Date.now();let buy=0,sell=0,n=0;

while(roll.length&&roll[0].r<cut)roll.shift();if(roll.length>500)roll.splice(0,roll.length-500);
let sum=0;for(const q of roll)sum+=q.usd;
const single=s.usd>=P.singleUsd,cluster=roll.length>=P.clusterN&&sum>=P.clusterUsd;
if(!single&&!cluster)return;
if(now-abMassLast[s.side]<Math.max(P.blockSec,20)*1000)return;
abMassLast[s.side]=now;abMassFire(s.side,single?s.usd:sum,single?'UMBRAL':'CLÚSTER '+roll.length+'/'+P.clusterSec+'s')}

DB.blockUntil=Date.now()+P.blockSec*1000;abShowBanner(txt,P.blockSec*1000);abSiren();
abLog('plus',txt+' ('+how+') · bloqueo '+P.blockSec+'s');

if(P.telegram)abTG('⚠ <b>LIQUIDACIÓN MASIVA BTC</b>\n'+label+' liquidados · <b>$'+fmtV(usd)+'</b>\n'+how+' · bloqueo de entradas '+P.blockSec+'s\n'+abVenueLabel()+' '+abSymbol()+' · '+abPxTag()+' · '+abUTC(Date.now()));
if(P.autoReduce){const px=abLastPx,part=P.closeAll?1:clamp(P.reducePct/100,0,1);
if(!(px>0)){abLog('risk','PLUS auto-reduce omitido: sin precio real de exchange');}
else{for(const pos of DB.positions.slice()){
if(pos.mode==='live'&&!AB.armed){abLog('risk','PLUS auto-reduce omitido (LIVE sin ARM)',{cid:pos.id});continue}
if(part>=0.999){pos.mode==='live'?abLiveClose(pos,'PLUS-CLOSE'):abPaperClose(pos,px,'PLUS-CLOSE')}

abLog('exit','PAPER REDUCE '+Math.round(part*100)+'% · queda '+pos.qty.toFixed(6),{cid:pos.id})}
else abLiveReduce(pos,part)}}}
abSave();abHeader()}
